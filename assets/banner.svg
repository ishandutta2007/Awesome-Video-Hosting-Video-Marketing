<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for subtle blur/glow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes barWave1 {
      0%, 100% { height: 35px; y: 45px; }
      50% { height: 65px; y: 15px; }
    }
    @keyframes barWave2 {
      0%, 100% { height: 60px; y: 20px; }
      50% { height: 30px; y: 50px; }
    }
    @keyframes barWave3 {
      0%, 100% { height: 50px; y: 30px; }
      50% { height: 75px; y: 5px; }
    }
    @keyframes barWave4 {
      0%, 100% { height: 40px; y: 40px; }
      50% { height: 60px; y: 20px; }
    }
    @keyframes signalPulse {
      0% { r: 6px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }

    .pulsing-glow {
      transform-origin: 600px 180px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-card {
      animation: floatWave 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 4s linear infinite;
    }
    .bar-1 { animation: barWave1 2.2s ease-in-out infinite; }
    .bar-2 { animation: barWave2 1.8s ease-in-out infinite; }
    .bar-3 { animation: barWave3 2.5s ease-in-out infinite; }
    .bar-4 { animation: barWave4 2.0s ease-in-out infinite; }
    .ping-circle { animation: signalPulse 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura in background -->
  <circle cx="600" cy="180" r="280" fill="url(#glowGrad)" class="pulsing-glow" filter="blur(40px)" />

  <!-- Subtle Matrix Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Side Graphic Left: Streaming & Transcoding Pipeline (kept away from center text) -->
  <g transform="translate(40, 70)" opacity="0.85">
    <rect width="150" height="95" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)" />
    <!-- Video Player Preview Icon -->
    <rect x="18" y="18" width="46" height="34" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <polygon points="37,30 37,42 47,36" fill="#ec4899" />
    <circle cx="95" cy="28" r="4" fill="#10b981" />
    <circle cx="95" cy="28" r="8" stroke="#10b981" stroke-width="1.5" fill="none" class="ping-circle" />
    <text x="106" y="32" fill="#9ca3af" class="badge-text">LIVE 4K</text>
    <!-- Transcoding progress bar -->
    <text x="18" y="70" fill="#6b7280" font-size="9" class="badge-text">HLS TRANSCODING</text>
    <rect x="18" y="76" width="114" height="4" rx="2" fill="#374151" />
    <rect x="18" y="76" width="82" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Animated Data Flow Line linking to bottom card -->
    <path d="M 75 95 L 75 140" fill="none" stroke="#8b5cf6" stroke-width="2" class="flow-line" />

    <!-- Storage & CDN Node Card -->
    <g transform="translate(0, 140)">
      <rect width="150" height="70" rx="10" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)" />
      <path d="M22 28 C22 23, 30 20, 42 20 C54 20, 62 23, 62 28 L62 48 C62 53, 54 56, 42 56 C30 56, 22 53, 22 48 Z" fill="none" stroke="#60a5fa" stroke-width="1.5" />
      <path d="M22 38 C22 43, 30 46, 42 46 C54 46, 62 43, 62 38" fill="none" stroke="#60a5fa" stroke-width="1.5" />
      <text x="74" y="36" fill="#e5e7eb" font-size="11" class="badge-text">S3 &amp; MinIO</text>
      <text x="74" y="50" fill="#9ca3af" font-size="9" class="sub-text">P2P Edge Mesh</text>
    </g>
  </g>

  <!-- Dynamic Side Graphic Right: Marketing Conversion & Viewer Analytics (kept away from center text) -->
  <g transform="translate(1010, 80)" class="floating-card">
    <rect width="150" height="190" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="18" y="28" fill="#e5e7eb" font-size="11" class="badge-text">MARKETING METRICS</text>
    <text x="18" y="42" fill="#9ca3af" font-size="9" class="sub-text">Realtime Lead Funnel</text>

    <!-- Animated Bar Chart -->
    <g transform="translate(20, 55)">
      <rect x="0" y="45" width="16" height="35" rx="3" fill="#ec4899" class="bar-1" />
      <rect x="26" y="20" width="16" height="60" rx="3" fill="#8b5cf6" class="bar-2" />
      <rect x="52" y="30" width="16" height="50" rx="3" fill="#3b82f6" class="bar-3" />
      <rect x="78" y="40" width="16" height="40" rx="3" fill="#10b981" class="bar-4" />
      <line x1="-5" y1="82" x2="105" y2="82" stroke="#4b5563" stroke-width="1" />
    </g>

    <!-- Mini Conversion Metric Pills -->
    <g transform="translate(16, 148)">
      <rect width="118" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#38bdf8" />
      <text x="22" y="16" fill="#c7d2fe" font-size="9.5" class="badge-text">Turnstile +34.8%</text>
    </g>
  </g>

  <!-- CENTER FOREGROUND: Title, Subtitle, and Categorical Badges (Completely clear of background elements) -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- Super-header Eyebrow Pill -->
    <rect x="-165" y="-45" width="330" height="28" rx="14" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <circle cx="-145" cy="-31" r="4" fill="#ec4899" />
    <text x="5" y="-27" fill="#f3f4f6" font-size="11" class="badge-text">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="#ffffff" font-size="40" class="title-text">
      Video Hosting &amp; Video Marketing
    </text>

    <!-- High-Contrast Gradient Sub-accent bar -->
    <rect x="-240" y="60" width="480" height="3" rx="1.5" fill="url(#accentGrad)" />

    <!-- Subtitle (Clear in Foreground) -->
    <text x="0" y="94" fill="#9ca3af" font-size="16" class="sub-text">
      Enterprise SaaS Platforms, Turnkey CRM Funnels &amp; Open-Source Streaming Infrastructure
    </text>

    <!-- Interactive Ecosystem Pillars -->
    <g transform="translate(0, 135)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#1f2937" stroke="#ec4899" stroke-width="1" />
        <text x="0" y="5" fill="#fbcfe8" class="badge-text">⚡ SaaS Leaders</text>
      </g>
      <!-- Pill 2: Open Source CMS -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-12" width="150" height="26" rx="13" fill="#1f2937" stroke="#8b5cf6" stroke-width="1" />
        <text x="0" y="5" fill="#ddd6fe" class="badge-text">🔓 Open-Source CMS</text>
      </g>
      <!-- Pill 3: Self-Hosted Mux -->
      <g transform="translate(90, 0)">
        <rect x="-70" y="-12" width="140" height="26" rx="13" fill="#1f2937" stroke="#3b82f6" stroke-width="1" />
        <text x="0" y="5" fill="#bfdbfe" class="badge-text">🚀 Mux Alternatives</text>
      </g>
      <!-- Pill 4: Analytics -->
      <g transform="translate(250, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="13" fill="#1f2937" stroke="#10b981" stroke-width="1" />
        <text x="0" y="5" fill="#a7f3d0" class="badge-text">📈 Video Analytics</text>
      </g>
    </g>
  </g>
</svg>
